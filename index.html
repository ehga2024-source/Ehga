<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>EHG Web Arranger & Pads (Safari Test)</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    h1 { font-size: 1.1rem; margin: 0 0 4px; color: #38bdf8; }
    p.sub { font-size: 0.85rem; margin: 0 0 16px; color: #94a3b8; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }
    button, label.file-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:active, label.file-btn:active { transform: scale(0.98); }
    .status { font-size: 0.85rem; color: #34d399; }
    .pads {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .pad {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 18px 12px;
      text-align: center;
      font-weight: 600;
      touch-action: manipulation;
    }
    .pad.active {
      background: #0284c7;
      border-color: #38bdf8;
    }
    .pad small { display: block; font-weight: 400; color: #94a3b8; margin-top: 4px; }
    .keyboard {
      display: flex;
      gap: 4px;
      height: 150px;
    }
    .key {
      flex: 1;
      background: #f8fafc;
      color: #0f172a;
      border-radius: 0 0 8px 8px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 10px;
      font-weight: bold;
      font-size: 0.85rem;
      touch-action: manipulation;
    }
    .key.active { background: #38bdf8; color: #fff; }
  </style>
</head>
<body>

  <h1>EHG entertainment — Web Audio Test</h1>
  <p class="sub">Prototipo ligero para probar desbloqueo de audio, pads WAV/MP3 y sinte en Safari</p>

  <div class="toolbar">
    <button id="btnUnlock">1. Activar Motor de Audio</button>
    <label class="file-btn">
      2. Cargar WAV/MP3 al Pad 1
      <input type="file" id="fileInput" accept="audio/*" hidden />
    </label>
    <button id="btnStopAll">Detener Todo</button>
    <span class="status" id="statusText">Audio bloqueado (toca Activar)</span>
  </div>

  <div class="pads">
    <div class="pad" id="pad1">Pad 1<small id="pad1Label">Sin muestra (toca para tono)</small></div>
    <div class="pad" id="pad2">Pad 2<small>Bombo Sintético</small></div>
    <div class="pad" id="pad3">Pad 3<small>Caja Sintética</small></div>
    <div class="pad" id="pad4">Pad 4<small>Acorde E. Piano</small></div>
  </div>

  <div class="keyboard" id="keyboard"></div>

  <script>
    let audioCtx = null;
    let pad1Buffer = null;
    let activeSources = [];

    const statusText = document.getElementById("statusText");

    function ensureAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      statusText.textContent = "Audio activo (" + audioCtx.sampleRate + " Hz)";
    }

    document.getElementById("btnUnlock").addEventListener("pointerdown", () => {
      ensureAudioContext();
      playTone(440, 0.15, "sine");
    });

    // Cargar archivo WAV o MP3 en Pad 1
    document.getElementById("fileInput").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      ensureAudioContext();
      try {
        const arrayBuffer = await file.arrayBuffer();
        pad1Buffer = await audioCtx.decodeAudioData(arrayBuffer);
        document.getElementById("pad1Label").textContent = file.name;
        statusText.textContent = "Muestra cargada: " + file.name;
      } catch (err) {
        statusText.textContent = "Error decodificando audio: " + err.message;
      }
    });

    function playTone(freq, duration = 0.5, type = "triangle") {
      ensureAudioContext();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.25, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration);
    }

    function playKick() {
      ensureAudioContext();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.18);
      gain.gain.setValueAtTime(0.7, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    }

    function playSnare() {
      ensureAudioContext();
      const bufferSize = audioCtx.sampleRate * 0.15;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      noise.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    }

    function flashPad(el) {
      el.classList.add("active");
      setTimeout(() => el.classList.remove("active"), 150);
    }

    // Eventos de Pads
    const pad1 = document.getElementById("pad1");
    pad1.addEventListener("pointerdown", () => {
      ensureAudioContext();
      flashPad(pad1);
      if (pad1Buffer) {
        const src = audioCtx.createBufferSource();
        src.buffer = pad1Buffer;
        src.connect(audioCtx.destination);
        src.start();
        activeSources.push(src);
      } else {
        playTone(523.25, 0.4, "sine");
      }
    });

    const pad2 = document.getElementById("pad2");
    pad2.addEventListener("pointerdown", () => { flashPad(pad2); playKick(); });

    const pad3 = document.getElementById("pad3");
    pad3.addEventListener("pointerdown", () => { flashPad(pad3); playSnare(); });

    const pad4 = document.getElementById("pad4");
    pad4.addEventListener("pointerdown", () => {
      flashPad(pad4);
      [261.63, 329.63, 392.00, 493.88].forEach(f => playTone(f, 0.9, "triangle"));
    });

    document.getElementById("btnStopAll").addEventListener("pointerdown", () => {
      activeSources.forEach(s => { try { s.stop(); } catch (_) {} });
      activeSources = [];
    });

    // Teclado de 1 octava
    const notes = [
      { name: "Do", freq: 261.63 },
      { name: "Re", freq: 293.66 },
      { name: "Mi", freq: 329.63 },
      { name: "Fa", freq: 349.23 },
      { name: "Sol", freq: 392.00 },
      { name: "La", freq: 440.00 },
      { name: "Si", freq: 493.88 },
      { name: "Do5", freq: 523.25 }
    ];

    const kb = document.getElementById("keyboard");
    notes.forEach(n => {
      const key = document.createElement("div");
      key.className = "key";
      key.textContent = n.name;
      key.addEventListener("pointerdown", () => {
        key.classList.add("active");
        playTone(n.freq, 0.65, "triangle");
        setTimeout(() => key.classList.remove("active"), 180);
      });
      kb.appendChild(key);
    });
  </script>
</body>
</html>
